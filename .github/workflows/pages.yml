# Tests and deploys the site to GitHub Pages on every push to main. No build step.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html french.js _site/
          # A new script URL per commit, so browsers never pair a new page with a cached old french.js.
          sed -i "s/french.js?v=dev/french.js?v=${GITHUB_SHA::8}/" _site/index.html
          grep -q "french.js?v=${GITHUB_SHA::8}" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
