<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Paper and ink, with a tricolore accent: rouge for actions, bleu for masculine, framboise for feminine. */
:root {
  --bg: 250 246 239; --surface: 255 253 249; --sunken: 243 237 227; --ink: 28 33 58; --muted: 100 100 116; --line: 229 220 205;
  --accent: 186 40 56; --accent-soft: 250 229 229; --accent-ink: 255 255 255; --navy: 28 45 102; --side: 24 34 78; --side-ink: 240 236 226;
  --good: 34 118 80; --good-soft: 226 241 232; --bad: 186 40 56; --bad-soft: 250 229 229;
  --warm: 176 112 20; --warm-soft: 250 238 210; --hl: 252 226 140; --gf: 178 56 118; --gm: 36 76 156;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 20 22 34; --surface: 29 31 46; --sunken: 38 40 58; --ink: 241 235 222; --muted: 168 164 160; --line: 56 56 74;
    --accent: 242 118 126; --accent-soft: 70 36 46; --accent-ink: 20 22 34; --navy: 150 176 240; --side: 13 15 26; --side-ink: 236 232 222;
    --good: 108 200 150; --good-soft: 30 52 42; --bad: 242 118 126; --bad-soft: 70 36 46;
    --warm: 226 182 100; --warm-soft: 60 48 26; --hl: 120 96 30; --gf: 236 132 186; --gm: 132 168 240;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: 20 22 34; --surface: 29 31 46; --sunken: 38 40 58; --ink: 241 235 222; --muted: 168 164 160; --line: 56 56 74;
  --accent: 242 118 126; --accent-soft: 70 36 46; --accent-ink: 20 22 34; --navy: 150 176 240; --side: 13 15 26; --side-ink: 236 232 222;
  --good: 108 200 150; --good-soft: 30 52 42; --bad: 242 118 126; --bad-soft: 70 36 46;
  --warm: 226 182 100; --warm-soft: 60 48 26; --hl: 120 96 30; --gf: 236 132 186; --gm: 132 168 240;
  color-scheme: dark;
}
/* Everything is sized in rem, and the root size grows with the window, so wide screens get bigger text, not empty space. */
html { font-size: clamp(15px, 0.62vw + 6.5px, 23px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font: 1rem/1.55 Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
input, button { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 0.4rem; }
.fr { font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-weight: 600; }
.muted { color: rgb(var(--muted)); }
.f { color: rgb(var(--gf)); } .m { color: rgb(var(--gm)); }

/* Dashboard shell: a navy sidebar beside the work area, full width. */
.shell { width: 100%; display: flex; min-height: 100vh; }
.side { width: 16rem; flex-shrink: 0; position: sticky; top: 0; height: 100vh; padding: 1.75rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; background: rgb(var(--side)); color: rgb(var(--side-ink)); }
.brand { display: flex; align-items: center; gap: 0.75rem; padding: 0 0.5rem; font: 700 1.7rem/1 'Cormorant Garamond', Georgia, serif; white-space: nowrap; }
.flag { display: flex; width: 1.7rem; height: 1.15rem; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.flag i { flex: 1; } .flag i:nth-child(1) { background: #2b52c4; } .flag i:nth-child(2) { background: #fff; } .flag i:nth-child(3) { background: #e03a4a; }
nav { display: flex; flex-direction: column; gap: 0.15rem; }
nav button { display: flex; align-items: center; gap: 0.6rem; border: 0; background: none; text-align: left; padding: 0.7rem 0.8rem; border-radius: 0.5rem; font-weight: 600; font-size: 1.02rem; color: rgb(var(--side-ink) / 0.72); position: relative; transition: background .2s, color .2s; }
nav button:hover { color: rgb(var(--side-ink)); background: rgb(255 255 255 / 0.05); }
nav button[aria-current] { color: rgb(var(--side-ink)); background: rgb(255 255 255 / 0.1); }
nav button[aria-current]::before { content: ''; position: absolute; left: 0; top: 0.6rem; bottom: 0.6rem; width: 3px; border-radius: 2px; background: #e03a4a; }
nav .meta { margin-left: auto; font-size: 0.8rem; opacity: 0.75; font-variant-numeric: tabular-nums; }
nav .badge { margin-left: auto; background: #e03a4a; color: #fff; border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.8rem; font-weight: 700; }
.side-foot { margin-top: auto; padding: 0.9rem 0.8rem; border-radius: 0.5rem; background: rgb(255 255 255 / 0.06); font-size: 0.88rem; }
.side-foot .meter { background: rgb(255 255 255 / 0.15); margin-top: 0.5rem; }
.side-foot .meter i { background: #fff; }
main { flex: 1; min-width: 0; padding: 2.25rem 2.75rem 4.5rem; }
h1 { font: 700 2.9rem/1.05 'Cormorant Garamond', Georgia, serif; margin: 0 0 0.5rem; color: rgb(var(--navy)); }
h2 { font: 700 1.5rem/1.2 'Cormorant Garamond', Georgia, serif; margin: 0 0 0.65rem; color: rgb(var(--navy)); }
.lede { margin: 0 0 1.5rem; color: rgb(var(--muted)); max-width: 70ch; font-size: 1.05rem; }
.panel { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); border-radius: 0.6rem; padding: 1.5rem; box-shadow: 0 1px 0 rgb(var(--line)); }
.stack > * + * { margin-top: 1rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: 999px; font-weight: 700; padding: 0.65rem 1.3rem; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); transition: transform .18s var(--ease), border-color .2s, background .2s; }
.btn:hover:not(:disabled) { border-color: rgb(var(--accent) / 0.5); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: rgb(var(--accent-ink)); }
.btn.primary:hover:not(:disabled) { background: rgb(var(--accent) / 0.9); }
.btn.ghost { border-color: transparent; background: none; color: rgb(var(--muted)); }
.btn.ghost:hover:not(:disabled) { color: rgb(var(--ink)); background: rgb(var(--sunken)); }
.btn.sm { padding: 0.45rem 0.9rem; font-size: 0.9rem; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 0.65rem; flex-wrap: wrap; align-items: center; }
.kbd { display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem; padding: 0 0.35rem; border: 1px solid rgb(var(--line)); border-bottom-width: 2px; border-radius: 0.35rem; font-size: 0.75rem; font-weight: 700; color: rgb(var(--muted)); background: rgb(var(--surface)); }
.chip { display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid rgb(var(--line)); color: rgb(var(--muted)); border-radius: 4px; padding: 0.2rem 0.5rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.chip.accent { border-color: rgb(var(--accent) / 0.35); color: rgb(var(--accent)); }
.chip.warm { border-color: rgb(var(--warm) / 0.45); color: rgb(var(--warm)); }

/* topic picker */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.5rem; }
.topics label { display: flex; gap: 0.65rem; align-items: center; padding: 0.7rem 0.8rem; border: 1px solid rgb(var(--line)); border-radius: 0.5rem; background: rgb(var(--surface)); cursor: pointer; font-weight: 600; transition: border-color .2s; }
.topics label:has(input:checked) { border-color: rgb(var(--navy) / 0.55); }
.topics input { accent-color: rgb(var(--accent)); width: 1.1rem; height: 1.1rem; }
.topics .meta { margin-left: auto; font-size: 0.85rem; color: rgb(var(--muted)); }
.seg { display: inline-flex; border: 1px solid rgb(var(--line)); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: rgb(var(--surface)); padding: 0.5rem 0.9rem; font-weight: 600; color: rgb(var(--muted)); }
.seg button[aria-pressed="true"] { background: rgb(var(--accent-soft)); color: rgb(var(--accent)); }

/* a session: progress, a stack of cards, the card itself */
.run-top { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1rem; }
.run-top .grow { flex: 1; min-width: 0; }
.run-title { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.9rem; margin-bottom: 0.4rem; }
.run-title b { font-weight: 700; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: rgb(var(--line)); transition: background .3s var(--ease), transform .3s var(--ease); }
.segs i.cur { background: rgb(var(--accent) / 0.35); transform: scaleY(1.6); }
.segs i.ok { background: rgb(var(--accent)); } .segs i.no { background: rgb(var(--warm)); }
.track { height: 5px; border-radius: 3px; background: rgb(var(--line)); overflow: hidden; }
.track i { display: block; height: 100%; background: rgb(var(--accent)); transition: width .4s var(--ease); }
.deck { position: relative; padding-bottom: 1.25rem; }
.deck::before, .deck::after { content: ''; position: absolute; height: 4rem; border-radius: 0.9rem; bottom: 0; }
.deck::before { left: 1.5rem; right: 1.5rem; background: rgb(var(--line) / 0.7); }
.deck::after { left: 0.75rem; right: 0.75rem; bottom: 0.6rem; background: rgb(var(--line)); }
.qcard { position: relative; z-index: 1; background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); border-radius: 0.9rem; padding: 1.9rem; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 0.75rem 2rem rgb(var(--accent) / 0.08); }
.qcard.leaving { position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.show { font-size: clamp(2.4rem, 4.2vw, 4.4rem); line-height: 1.1; margin: 0.9rem 0 0.35rem; overflow-wrap: anywhere; }
.show.en { font: 700 clamp(1.6rem, 2.6vw, 2.6rem)/1.25 Manrope, system-ui, sans-serif; letter-spacing: -0.01em; }
.prompt { font-size: 1.15rem; font-weight: 600; margin: 0.4rem 0 1.1rem; }
.field label { display: block; font-size: 0.85rem; font-weight: 700; color: rgb(var(--muted)); margin-bottom: 0.35rem; }
.answer { width: 100%; padding: 0.7rem 0.9rem; border: 2px solid rgb(var(--line)); border-radius: 0.75rem; background: rgb(var(--surface)); font-size: 1.25rem; transition: border-color .2s, background .2s; }
.answer.fr { font: 600 1.7rem 'Cormorant Garamond', Georgia, serif; }
.answer:focus { outline: none; border-color: rgb(var(--navy)); }
.answer.ok { border-color: rgb(var(--good)); background: rgb(var(--good-soft)); }
.answer.no { border-color: rgb(var(--bad)); background: rgb(var(--bad-soft)); }
.keys { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.6rem 0 0; }
.keys button { min-width: 2.4rem; padding: 0.3rem 0.5rem; border-radius: 0.55rem; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); font: 600 1.2rem 'Cormorant Garamond', Georgia, serif; transition: transform .15s; }
.keys button:active { transform: scale(0.94); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
.choices button { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1rem; border-radius: 0.75rem; border: 2px solid rgb(var(--line)); background: rgb(var(--surface)); font-weight: 700; font-size: 1.05rem; text-align: left; transition: border-color .2s, background .2s, transform .15s; }
.choices button:hover:not(:disabled) { border-color: rgb(var(--accent) / 0.6); }
.choices button:active:not(:disabled) { transform: scale(0.98); }
.choices button.ok { border-color: rgb(var(--good)); background: rgb(var(--good-soft)); }
.choices button.no { border-color: rgb(var(--bad)); background: rgb(var(--bad-soft)); }
.hint { color: rgb(var(--muted)); margin: 0.75rem 0 0; }
.result { margin-top: 1.25rem; }
.verdict { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.verdict.ok { color: rgb(var(--good)); } .verdict.no { color: rgb(var(--bad)); }
.gold { font: 600 2rem/1.2 'Cormorant Garamond', Georgia, serif; color: rgb(var(--good)); margin: 0.4rem 0; display: flex; flex-wrap: wrap; }
.gold.en { font: 700 1.5rem/1.3 Manrope, sans-serif; }
.gold span { display: inline-block; white-space: pre; }
.gold span.diff { background: rgb(var(--hl)); border-radius: 4px; }
.translation { border-left: 3px solid rgb(var(--navy) / 0.4); padding: 0.2rem 0 0.2rem 0.9rem; margin: 0.75rem 0; }
.translation .fr { font-size: 1.6rem; display: block; }
.note-box { border-radius: 0.75rem; padding: 0.8rem 1rem; margin: 0.75rem 0; background: rgb(var(--sunken)); line-height: 1.55; }
.note-box b { font-weight: 800; }
.remind { margin: 0.6rem 0; padding: 0.55rem 0.85rem; border-left: 3px solid rgb(var(--accent) / 0.6); background: rgb(var(--accent-soft) / 0.45); border-radius: 0 0.5rem 0.5rem 0; line-height: 1.5; }
.remind b { color: rgb(var(--accent)); font-weight: 800; }
.before-box { display: inline-block; margin: 0.9rem 0 0.8rem; padding: 0.45rem 0.9rem; border: 2px solid rgb(var(--accent) / 0.45); background: rgb(var(--accent-soft) / 0.5); border-radius: 0.6rem; font-size: 1.25rem; font-weight: 800; color: rgb(var(--accent)); }
.before-box b { text-transform: uppercase; }
.retype { margin: 0.9rem 0 0.4rem; padding: 1rem; border: 2px dashed rgb(var(--warm) / 0.55); border-radius: 0.75rem; background: rgb(var(--warm-soft) / 0.5); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.65rem; }
.formgrid .field.m label { color: rgb(var(--gm)); } .formgrid .field.f label { color: rgb(var(--gf)); }
.result-grid { margin: 0.6rem 0; }
.result-grid .cell { border-radius: 0.6rem; padding: 0.5rem 0.75rem; background: rgb(var(--sunken)); border: 2px solid transparent; }
.result-grid .cell.ok { border-color: rgb(var(--good) / 0.35); } .result-grid .cell.no { border-color: rgb(var(--bad) / 0.45); background: rgb(var(--bad-soft) / 0.5); }
.result-grid .cell.acc { border-color: rgb(var(--warm) / 0.5); }
.result-grid small { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: rgb(var(--muted)); }
.result-grid .gold { font-size: 1.6rem; margin: 0.1rem 0 0; }
.retype-title { font-size: 0.85rem; font-weight: 700; color: rgb(var(--warm)); margin-bottom: 0.5rem; }
.score-row { display: flex; flex-wrap: wrap; gap: 2rem; }
.score-row b { display: block; font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.trophy { width: 3.6rem; height: 3.6rem; border-radius: 1rem; display: grid; place-items: center; background: rgb(var(--warm-soft)); color: rgb(var(--warm)); }
.missed li { margin: 0.5rem 0; }

/* learn: meet, match, recall */
.steps { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; font-weight: 700; color: rgb(var(--muted)); margin-bottom: 1rem; flex-wrap: wrap; }
.steps span { display: inline-flex; align-items: center; gap: 0.4rem; }
.steps span i { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 0.8rem; background: rgb(var(--sunken)); }
.steps span.on { color: rgb(var(--accent)); } .steps span.on i { background: rgb(var(--accent)); color: rgb(var(--accent-ink)); }
.steps span.past i { background: rgb(var(--good)); color: #fff; }
.steps .sep { width: 1.5rem; height: 2px; background: rgb(var(--line)); }
.meet .word { font-size: clamp(3rem, 5vw, 5rem); line-height: 1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.6rem; }
.meaning { font-size: 1.7rem; font-weight: 700; margin: 0.6rem 0 1rem; letter-spacing: -0.01em; }
.forms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
.forms span { background: rgb(var(--sunken)); border-radius: 0.5rem; padding: 0.5rem 0.7rem; font-size: 1.5rem; }
.forms small { display: block; font: 700 0.7rem Manrope, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: rgb(var(--muted)); }
.copy { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.match .col { display: flex; flex-direction: column; gap: 0.6rem; }
.match button { padding: 0.8rem 1rem; border-radius: 0.75rem; border: 2px solid rgb(var(--line)); background: rgb(var(--surface)); text-align: left; font-size: 1.05rem; transition: border-color .2s, background .2s, transform .15s; }
.match button.fr { font-size: 1.5rem; }
.match button:hover { border-color: rgb(var(--accent) / 0.5); }
.match button.sel { border-color: rgb(var(--accent)); background: rgb(var(--accent-soft)); }
.match button.no { border-color: rgb(var(--bad)); background: rgb(var(--bad-soft)); }

/* dashboard */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.9rem; margin-bottom: 1.1rem; }
.ask { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; font-weight: 800; color: rgb(var(--muted)); }
.tile .num { font: 700 2.9rem/1 'Cormorant Garamond', Georgia, serif; color: rgb(var(--navy)); margin: 0.4rem 0 0.25rem; font-variant-numeric: tabular-nums; }
.tile .num small { font-size: 1.4rem; color: rgb(var(--muted)); }
.dash { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.1rem; align-items: start; }
.meter { height: 0.45rem; border-radius: 4px; background: rgb(var(--sunken)); overflow: hidden; }
.meter i { display: block; height: 100%; background: rgb(var(--navy)); border-radius: 4px; transition: width .8s var(--ease); }
.meter.good i { background: rgb(var(--good)); } .meter.low i { background: rgb(var(--accent)); }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 8rem 3rem; gap: 0.75rem; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid rgb(var(--line)); }
.drow:last-child { border-bottom: 0; }
.drow button { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; color: rgb(var(--ink)); }
.drow button:hover { color: rgb(var(--accent)); }
.drow .pct { text-align: right; font-size: 0.85rem; color: rgb(var(--muted)); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-direction: column; gap: 0.6rem; }
.actions .btn { justify-content: space-between; width: 100%; }
.words { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
.words span { border: 1px solid rgb(var(--accent) / 0.35); color: rgb(var(--accent)); border-radius: 999px; padding: 0.1rem 0.65rem; font: 600 1.15rem 'Cormorant Garamond', Georgia, serif; }
.lesson { display: flex; align-items: center; gap: 0.9rem; }
.lesson .code { width: 3.3rem; height: 3.3rem; border-radius: 0.5rem; background: rgb(var(--accent-soft)); color: rgb(var(--accent)); display: grid; place-items: center; font: 700 1.15rem 'Cormorant Garamond', Georgia, serif; flex-shrink: 0; }
.lesson-body { flex: 1; min-width: 0; }

/* vocab tabs, word table */
.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid rgb(var(--line)); margin-bottom: 1.1rem; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 0.65rem 0.9rem; font-weight: 700; color: rgb(var(--muted)); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .2s, border-color .2s; }
.tabs button[aria-selected="true"] { color: rgb(var(--accent)); border-bottom-color: rgb(var(--accent)); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 0.55rem 0.65rem; border-bottom: 1px solid rgb(var(--line)); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgb(var(--muted)); font-weight: 800; }
td.fr { font-size: 1.25rem; }
.scroll { overflow-x: auto; }
.tag { display: inline-block; border: 1px solid rgb(var(--accent) / 0.4); color: rgb(var(--accent)); border-radius: 4px; padding: 0.1rem 0.4rem; font: 700 0.7rem Manrope, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; margin-left: 0.4rem; vertical-align: 0.15em; }
.tag.warm { border-color: rgb(var(--warm) / 0.5); color: rgb(var(--warm)); }
.note { color: rgb(var(--muted)); font-size: 0.92rem; }

/* grammar: the drill with its rule beside it */
.sheet-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(24rem, 1fr)); gap: 1.2rem 2.5rem; margin: 0.8rem 0 0; padding-left: 1.6rem; }
.sheet-list li::marker { font-weight: 700; color: rgb(var(--muted)); }
.sheet-list .fr { font: 600 1.45rem/1.3 'Cormorant Garamond', Georgia, serif; margin-bottom: 0.4rem; }
.sheet-list .en-q { font-weight: 600; margin-bottom: 0.4rem; }
.sheet-list .gold { font-size: 1.5rem; }
.sheet-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; justify-content: space-between; padding: 0.6rem 0; margin-bottom: 1rem; background: rgb(var(--bg)); }
.sheet-bar .keys { margin: 0; }
.parts { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.5rem; }
.parts button { border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); border-radius: 999px; padding: 0.45rem 0.9rem; font-weight: 600; color: rgb(var(--muted)); }
.parts button[aria-pressed="true"] { background: rgb(var(--accent-soft)); border-color: rgb(var(--accent) / 0.5); color: rgb(var(--accent)); }
.with-help { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(20rem, 1fr); gap: 1.5rem; align-items: start; }
.help { position: sticky; top: 1.25rem; max-height: calc(100vh - 2.5rem); overflow-y: auto; }
.help .panel { background: rgb(var(--sunken) / 0.6); }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.4rem 1.25rem; margin-top: 0.65rem; }
.ex .fr { font-size: 1.25rem; }
.big { font: 600 1.65rem/1.4 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.02em; }
.big b { color: rgb(var(--accent)); }
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); gap: 1rem; }

@media (max-width: 1180px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash, .with-help { grid-template-columns: 1fr; }
  .help { position: static; max-height: none; }
}
@media (max-width: 760px) {
  .shell { flex-direction: column; }
  .side { position: static; height: auto; width: auto; padding: 0.75rem 1rem; flex-direction: row; align-items: center; gap: 0.75rem; }
  .brand { padding: 0; } .brand b { display: none; }
  nav { flex-direction: row; overflow-x: auto; }
  nav button { white-space: nowrap; padding: 0.5rem 0.65rem; }
  nav .meta, .side-foot { display: none; }
  nav button[aria-current]::before { left: 0.6rem; right: 0.6rem; top: auto; bottom: 2px; width: auto; height: 2px; }
  main { padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 2.3rem; }
  .qcard { padding: 1.2rem; }
  .rules, .ex, .copy { grid-template-columns: 1fr; }
  .ex .en-ex { margin-top: 0.4rem; }
  .drow { grid-template-columns: minmax(0, 1fr) 4.5rem 2.5rem; }
  .forms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="flag" aria-hidden="true"><i></i><i></i><i></i></span><b>French Hub</b></div>
    <nav aria-label="Sections" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main"></main>
</div>
<script src="french.js?v=dev"></script>
<script>
const { LNOUNS, SHEET, ADJ, LESSONS, GROUPS, BEFORE, GRAMMAR, RULE_OF, question, check, review, DAY, MIN } = window.FR;
const byId = window.FR.byId;
const $main = document.getElementById('main');

// h('div.class', {attrs}, ...children): a tiny DOM builder. Strings become text nodes, so nothing is parsed as HTML.
function h(tag, attrs, ...kids) {
  const [name, ...cls] = tag.split('.');
  const el = document.createElement(name);
  if (cls.length) el.className = cls.join(' ');
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k);
  return el;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('frhub:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('frhub:' + k, JSON.stringify(v)); } catch (e) { /* private mode: fine */ } },
};
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- motion (the Latin hub's motion vocabulary, in the Web Animations API) ---------- */
const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function anim(el, frames, ms, opts) { if (!el || still()) return { finished: Promise.resolve() }; return el.animate(frames, { duration: ms, easing: EASE, fill: 'both', ...opts }); }
const shake = (el) => anim(el, [{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], 420, { easing: 'ease-out', fill: 'none' });
const pop = (el) => anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.025)' }, { transform: 'scale(1)' }], 300, { fill: 'none' });
const fadeUp = (el, delay = 0) => anim(el, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], 300, { delay });
function drawCheck() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('width', '1.3em'); svg.setAttribute('height', '1.3em'); svg.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M20 6 9 17l-5-5'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '2.6'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
  p.style.strokeDasharray = '30'; svg.append(p);
  anim(p, [{ strokeDashoffset: 30 }, { strokeDashoffset: 0 }], 350);
  return svg;
}
// The correct answer types itself in; letters that differ from what you wrote are highlighted.
function diff(gold, typed, en) {
  const g = String(gold), gl = g.toLowerCase(), t = String(typed || '').trim().toLowerCase();
  let p = 0; while (p < gl.length && p < t.length && gl[p] === t[p]) p++;
  let s = 0; while (s < gl.length - p && s < t.length - p && gl[gl.length - 1 - s] === t[t.length - 1 - s]) s++;
  const lo = t ? p : -1, hi = t ? gl.length - s : -1;
  const el = h('div.gold' + (en ? '.en' : ''), { 'aria-label': g, lang: en ? 'en' : 'fr' });
  g.split('').forEach((ch, i) => { const sp = h('span' + (i >= lo && i < hi ? '.diff' : ''), { 'aria-hidden': 'true' }, ch); el.append(sp); anim(sp, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], 220, { delay: i * 28 }); });
  return el;
}
function countUp(el, to, suffix = '') {
  if (still()) { el.textContent = to + suffix; return; }
  const t0 = performance.now();
  const tick = (t) => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 4); el.textContent = Math.round(to * e) + suffix; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- progress ---------- */
// cards: word id → FSRS card (a word has one once it's learned). words: id → { n seen, r right, s right-in-a-row }.
// topics: drill id → { n, r }. days: 'YYYY-MM-DD' → answers that day.
const P = Object.assign({ words: {}, topics: {}, days: {}, cards: {} }, store.get('progress', {}));
P.cards ||= {};
const save = () => { P.t = Date.now(); store.set('progress', P); cloudPush(); };

/* ---------- account sync: inside Claude's page, progress follows your Claude account (like the Latin hub) ---------- */
let cloud = null, syncState = 'local', pushT = 0;
const copyP = () => JSON.parse(JSON.stringify(P));
function cloudPush(now) {
  if (!cloud) return;
  syncState = 'saving';
  clearTimeout(pushT);
  const send = () => { pushT = 0; cloud.set(copyP()).then(() => { syncState = 'saved'; renderNav(); }, () => { syncState = 'error'; renderNav(); }); };
  if (now) send(); else pushT = setTimeout(send, 600);
}
function replaceP(d) { for (const k of Object.keys(P)) delete P[k]; Object.assign(P, { words: {}, topics: {}, days: {}, cards: {} }, JSON.parse(JSON.stringify(d))); store.set('progress', P); }
async function connect() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/french-progress');
    const snap = await ref.get();
    cloud = ref;
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.t || 0) >= (P.t || 0)) { replaceP(remote); syncState = 'saved'; if (onPage) go(current); }
    else if (P.t) cloudPush(true); // this browser is newer
    else syncState = 'saved';
    renderNav();
  } catch (e) { syncState = 'local'; renderNav(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && pushT) cloudPush(true); });
// Outside Claude (the GitHub Pages copy) progress lives in this browser; a backup code moves it to another one.
function backupButtons() {
  const copy = h('button.btn.ghost.sm', { type: 'button', onclick: async () => {
    try { await navigator.clipboard.writeText(JSON.stringify({ app: 'french-hub', P })); copy.textContent = 'Copied ✓'; } catch (e) { prompt('Copy this backup code:', JSON.stringify({ app: 'french-hub', P })); }
  } }, 'Copy backup');
  const paste = h('button.btn.ghost.sm', { type: 'button', onclick: () => {
    const s = prompt('Paste a backup code from your other device:');
    if (!s) return;
    let d; try { d = JSON.parse(s); } catch (e) { d = null; }
    if (!d || d.app !== 'french-hub' || !d.P || typeof d.P !== 'object') return alert('That isn’t a French Hub backup code.');
    if ((d.P.t || 0) < (P.t || 0) && !confirm('This backup is older than the progress here. Replace it anyway?')) return;
    replaceP(d.P); save(); go(current);
  } }, 'Paste backup');
  return h('div.row', { style: 'margin-top:0.6rem;gap:0.4rem' }, copy, paste);
}
const SYNC = { saved: '✓ Saved to your Claude account', saving: 'Saving…', error: 'Couldn’t reach your account. Saved here.', local: 'Saved in this browser' };
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function record(q, ok) {
  const w = P.words[q.word] ||= { n: 0, r: 0, s: 0 };
  w.n++; if (ok) { w.r++; w.s++; } else w.s = 0;
  const t = P.topics[q.topic] ||= { n: 0, r: 0 };
  t.n++; if (ok) t.r++;
  P.days[dayKey()] = (P.days[dayKey()] || 0) + 1;
  save();
}
function unrecord(q) { // "I was correct": turn the last miss into a hit
  const w = P.words[q.word], t = P.topics[q.topic];
  if (w) { w.r++; w.s = 1; } if (t) t.r++;
  save();
}
const learned = (id) => !!P.cards[id];
const dueWords = (now = Date.now()) => ADJ.filter((a) => P.cards[a.id] && P.cards[a.id].due <= now).sort((a, b) => P.cards[a.id].due - P.cards[b.id].due);
const newWords = () => ADJ.filter((a) => !learned(a.id));
const nextDue = () => Math.min(...ADJ.map((a) => (P.cards[a.id] ? P.cards[a.id].due : Infinity)));
const trouble = () => ADJ.filter((a) => { const w = P.words[a.id]; return w && w.n && (w.s === 0 || (w.n >= 3 && w.r / w.n < 0.6)); });
function dayStreak() {
  const d = new Date(); let n = 0;
  if (!P.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (P.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const pct = (r, n) => (n ? Math.round((r / n) * 100) : null);
function meter(v, cls) { const i = h('i', { style: 'width:0%' }); requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = (v || 0) + '%'; })); return h('div.meter' + (cls ? '.' + cls : ''), null, i); }
function when(t) {
  const d = t - Date.now();
  if (!isFinite(t)) return '–';
  if (d <= 0) return 'now';
  if (d < 3600000) return 'in ' + Math.max(1, Math.round(d / MIN)) + ' min';
  if (d < DAY) return 'in ' + Math.round(d / 3600000) + ' h';
  const days = Math.round(d / DAY);
  return days === 1 ? 'tomorrow' : 'in ' + days + ' days';
}
function grammarAcc() {
  const t = GRAMMAR.reduce((a, [id]) => { const x = P.topics[id] || { n: 0, r: 0 }; return { n: a.n + x.n, r: a.r + x.r }; }, { n: 0, r: 0 });
  return pct(t.r, t.n);
}

/* ---------- navigation ---------- */
const PAGES = { home: Home, vocab: Vocab, grammar: Grammar, sheet: Sheet, rules: Rules };
const OLD = { practice: 'grammar', words: 'vocab' };
const NAV = [['home', 'Dashboard'], ['sheet', 'Quiz'], ['vocab', 'Vocab'], ['grammar', 'Grammar'], ['rules', 'Rules']];
let current = 'home', keyHandler = null, onPage = true; // onPage: a plain page, not a quiz in progress
function renderNav() {
  const due = dueWords().length, g = grammarAcc(), l = ADJ.filter((a) => learned(a.id)).length;
  document.getElementById('nav').replaceChildren(...NAV.map(([id, label]) => h('button', { type: 'button', 'aria-current': id === current ? 'page' : null, onclick: () => go(id) }, label,
    id === 'vocab' && due ? h('span.badge', { title: due + ' words due for review' }, String(due)) : null,
    id === 'grammar' && g != null ? h('span.meta', null, g + '%') : null)));
  document.getElementById('side-foot').replaceChildren(h('div', null, l + ' / ' + ADJ.length + ' words learned'), meter((l / ADJ.length) * 100),
    h('div.sync', { style: 'margin-top:0.6rem;opacity:0.8' }, SYNC[syncState]), cloud ? null : backupButtons());
}
function go(page, view) {
  page = OLD[page] || page;
  if (!PAGES[page]) page = 'home';
  current = page; keyHandler = null; onPage = !view;
  if (location.hash.slice(1) !== page) history.replaceState(null, '', '#' + page);
  renderNav();
  const el = view || PAGES[page]();
  $main.replaceChildren(el);
  fadeUp(el);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
// One keyboard handler for whatever card is showing (Enter, number keys for choices).
window.addEventListener('keydown', (e) => { if (keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey) keyHandler(e); });

/* ---------- one question card ---------- */
const KIND = { 'fr-en': 'French → English', 'en-fr': 'English → French', forms: 'One form', all: 'All forms', sent: 'Sentence', phrase: 'Phrase', place: 'Word order', bel: 'bel · nouvel · vieil', de: 'de or des', hair: 'Hair', gender: 'Noun gender' };
const SHORT = { 'masculine singular': 'masc.', 'feminine singular': 'fem.', 'masculine plural': 'masc. pl.', 'feminine plural': 'fem. pl.', 'before a vowel': 'before a vowel' };
const textInput = (lang, id, extra) => h('input.answer' + (lang === 'fr' ? '.fr' : ''), { type: 'text', id, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', lang, ...extra });
// Accent buttons type into whichever box was last focused.
let lastBox = null;
document.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches('input.answer')) lastBox = e.target; });
const accentKeys = () => h('div.keys', { 'aria-label': 'Accented letters' }, ['é', 'è', 'ê', 'à', 'â', 'ç', 'ï', 'î', 'ô', 'û'].map((c) => h('button', { type: 'button', tabindex: '-1', onmousedown: (e) => e.preventDefault(), onclick: () => {
  const t = lastBox; if (!t || t.readOnly || !t.isConnected) return;
  const s = t.selectionStart ?? t.value.length, e2 = t.selectionEnd ?? s;
  t.value = t.value.slice(0, s) + c + t.value.slice(e2); t.focus(); t.setSelectionRange(s + 1, s + 1); t.dispatchEvent(new Event('input'));
} }, c)));

// onDone({ ok, q }) fires when the learner moves on. Every typed answer that was wrong has to be typed again correctly first.
function QCard(q, onDone) {
  let res = null, hinted = false, override = false, timer = null, closed = false;
  // A question is one or more boxes; a plain question is a single box.
  const cells = q.cells || [{ label: q.lang === 'en' ? 'English' : 'French', answers: q.answers }];
  const multi = cells.length > 1;
  const el = h('div.qcard');
  const result = h('div.result', { 'aria-live': 'polite' });
  const hintEl = h('p.hint', { hidden: true }, q.hint || '');
  const finish = () => { if (closed) return; closed = true; clearTimeout(timer); keyHandler = null; onDone({ ok: res.ok || override, q }); };
  const cellCheck = (c, v) => check({ lang: q.lang, answers: c.answers }, v);

  function grade(values, gaveUp) {
    if (res) return;
    if (!gaveUp && !q.choices && !values.some((v) => String(v).trim())) return;
    let per;
    if (gaveUp) per = cells.map(() => ({ ok: false }));
    else if (q.choices) per = [{ ok: values[0] === q.answers[0] }];
    else per = cells.map((c, i) => cellCheck(c, values[i]));
    res = { ok: per.every((p) => p.ok), accent: per.some((p) => p.accent), per, given: gaveUp ? cells.map(() => '') : values };
    res.accentOnly = !res.ok && per.every((p) => p.ok || p.accent); // right letters, wrong or missing accents
    record(q, res.ok);
    hintEl.hidden = true;
    controls.hidden = true;
    showResult();
  }
  function showResult() {
    const ok = res.ok;
    const nextBtn = h('button.btn.primary', { type: 'button', onclick: finish }, 'Next →');
    const right = res.per.filter((p) => p.ok).length;
    const parts = [h('div.verdict.' + (ok ? 'ok' : 'no'), null, ok ? drawCheck() : '✕',
      ok ? (hinted ? 'Right, with a hint' : 'Correct') : multi ? right + ' of ' + cells.length + ' right' + (res.accent ? ' · check the accents' : '') : res.accentOnly ? 'Accent missing' : 'Not quite')];
    if (multi) {
      // Each form with the right answer under it; the ones you missed are highlighted where they differ.
      parts.push(h('div.formgrid.result-grid', null, cells.map((c, i) => h('div.cell.' + (res.per[i].ok ? 'ok' : res.per[i].accent ? 'acc' : 'no'), null,
        h('small', null, SHORT[c.label] || c.label, res.per[i].accent ? ' · accent' : ''), res.per[i].ok ? h('div.gold.small', { lang: 'fr' }, c.answers[0]) : diff(c.answers[0], res.given[i], false)))));
    } else if (!ok) parts.push(diff(q.answers[0], res.given[0], q.lang === 'en'));
    if (res.accent) parts.push(h('div.note-box', null, h('b', null, 'Accents count. '), 'é, è, ê, ç, ï… are part of the spelling: the highlighted letter needs its accent. Use the buttons under the box, or hold the letter on a Mac keyboard.'));
    if (q.full) parts.push(h('div.translation', null, h('span.fr', { lang: 'fr' }, q.full), h('span.muted', null, q.en)));
    else if (q.showLang === 'en' && q.lang === 'fr' && ok && !multi) parts.push(h('div.translation', null, h('span.fr', { lang: 'fr' }, q.answers[0]), h('span.muted', null, q.show)));
    if (!ok || q.full || q.topic === 'forms') parts.push(h('div.note-box', null, h('b', null, ok ? 'Why. ' : 'Rule. '), q.why));
    const wrong = q.choices ? [] : cells.map((c, i) => i).filter((i) => !res.per[i].ok);
    if (wrong.length) {
      // Type it again: Next unlocks once every missed form has been written out correctly.
      nextBtn.disabled = true;
      const boxes = wrong.map((i, k) => {
        const inp = textInput(q.lang, 'retype' + k, { 'data-retype': '1' });
        inp.addEventListener('input', () => { if (cellCheck(cells[i], inp.value).ok && !inp.readOnly) { inp.classList.add('ok'); inp.readOnly = true; pop(inp); const nxt = boxes.find((b) => !b.readOnly); if (nxt) nxt.focus(); else unlock(); } });
        inp.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault(); e.stopPropagation();
          if (!nextBtn.disabled) return finish();
          if (inp.value.trim() && !inp.readOnly) { inp.classList.add('no'); shake(inp); setTimeout(() => inp.classList.remove('no'), 500); }
        });
        return inp;
      });
      const unlock = () => { nextBtn.disabled = false; timer = setTimeout(finish, 650); };
      parts.push(h('div.retype', null, h('div.retype-title', null, 'Type ' + (wrong.length > 1 ? 'them' : 'it') + ' again, correctly, to move on'),
        h('div' + (multi ? '.formgrid' : ''), null, wrong.map((i, k) => h('div.field', null, multi ? h('label', { for: 'retype' + k }, SHORT[cells[i].label] || cells[i].label) : null, boxes[k]))),
        q.lang === 'fr' ? accentKeys() : null));
      setTimeout(() => boxes[0].focus(), 60);
    }
    const sure = !ok ? h('button.btn.ghost', { type: 'button', onclick: () => { override = true; unrecord(q); finish(); } }, 'I was correct') : null;
    parts.push(h('div.row', { style: 'margin-top:0.9rem' }, nextBtn, wrong.length ? h('button.btn.ghost', { type: 'button', onclick: finish }, 'Skip') : null, sure,
      h('span.note', { style: 'margin-left:auto' }, h('span.kbd', null, 'Enter'), ' next')));
    result.replaceChildren(...parts);
    fadeUp(result);
    if (ok) timer = setTimeout(finish, q.full || multi ? 1900 : 1100);
    if (ok || q.choices) nextBtn.focus();
    keyHandler = (e) => { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON' && !(e.target.dataset && e.target.dataset.retype) && !nextBtn.disabled) { e.preventDefault(); finish(); } };
  }

  let body, controls, inputs = [];
  const hintBtn = h('button.btn', { type: 'button', onclick: () => { hinted = true; hintEl.hidden = false; fadeUp(hintEl); hintBtn.disabled = true; } }, '💡 Hint');
  const giveUp = h('button.btn.ghost', { type: 'button', onclick: () => { grade([], true); inputs.forEach((x) => { x.classList.add('no'); x.readOnly = true; }); } }, 'I don’t know');
  if (q.choices) {
    body = h('div.choices', null, q.choices.map((c, i) => h('button', { type: 'button', 'data-v': c, onclick: (e) => {
      if (res) return;
      grade([c]);
      body.querySelectorAll('button').forEach((b) => { b.disabled = true; if (b.dataset.v === q.answers[0]) b.classList.add('ok'); else if (b === e.currentTarget) { b.classList.add('no'); shake(b); } });
    } }, h('span.kbd', null, String(i + 1)), c)));
    controls = h('div.row', { style: 'margin-top:0.8rem' }, hintBtn, giveUp);
    keyHandler = (e) => { const i = +e.key - 1; if (!res && q.choices[i]) { e.preventDefault(); body.querySelectorAll('button')[i].click(); } };
  } else {
    inputs = cells.map((c, i) => textInput(q.lang, 'ans' + i));
    const submit = () => {

    if (checked === items.length) { checkBtn.hidden = true; renderNav(); }
  }
  items.forEach((it, i) => it.inp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (it.inp.value.trim()) gradeOne(it);
    const nxt = items.slice(i + 1).concat(items.slice(0, i)).find((x) => !x.done);
    if (nxt) nxt.inp.focus();
  }));
  function grade() {
    items.forEach(gradeOne);
    const first = items.find((x) => x.inp.classList.contains('no'));
    (first ? first.inp : score).scrollIntoView({ behavior: still() ? 'auto' : 'smooth', block: 'center' });
  }
  const checkBtn = h('button.btn.primary', { type: 'button', onclick: grade }, 'Check my answers');
  const bar = h('div.sheet-bar', null, accentKeys(), h('div.row', null, score, h('button.btn', { type: 'button', onclick: () => go('sheet') }, 'New quiz')));
  parts.forEach((c, i) => fadeUp(c, 50 * i));
  setTimeout(() => items[0] && items[0].inp.focus(), 60);
  return h('div', null,
    h('h1', null, 'Quiz'),
    h('p.lede', null, 'A quiz like the class handouts, with new questions every time. Press Enter to check each answer as you go, or fill them all in and check at the end: mistakes show the right answer and the rule.'),
    picker, bar, h('div.stack', null, parts), h('div.row', { style: 'margin-top:1.2rem' }, checkBtn));
}

/* ---------- rules ---------- */
const ex = (pairs) => h('div.ex', null, pairs.flatMap(([en, fr]) => [h('div.en-ex.muted', null, en), h('div.fr', { lang: 'fr' }, fr)]));
const card = (title, ...kids) => h('section.panel', null, h('h2', null, title), ...kids);
const RULES = {
  agree: () => card('Agreement',
    h('p', null, 'Adjectives match the noun: add ', h('b', null, '-e'), ' for feminine, ', h('b', null, '-s'), ' for plural.'),
    ex([['a green bird', 'un oiseau vert'], ['a green house', 'une maison verte'], ['green birds', 'des oiseaux verts'], ['The houses are green.', 'Les maisons sont vertes.']]),
    h('p.note', null, 'Already ends in -e (jeune, raide): no extra -e. Marron never changes. Ends in -s (anglais, japonais): no extra -s in the masculine plural. Nationalities are lower case: un livre anglais. Before a vowel, le / la become l’: l’ami, l’histoire.')),
  before: () => card('11 adjectives go before the noun',
    h('p.big', { lang: 'fr' }, BEFORE.map((w, i) => [i ? ' · ' : '', h('b', null, w[0].toUpperCase()), w.slice(1)])),
    h('p.note', null, 'Everything else goes after the noun.'),
    ex([['a small intellectual man', 'un petit homme intellectuel'], ['a new French story', 'une nouvelle histoire française'], ['a young beautiful dog', 'un jeune et beau chien'], ['an ugly green bird', 'un oiseau laid et vert']])),
  irr: () => card('Irregular patterns',
    h('div.scroll', null, h('table', null, h('tbody', null, [
      ['-eux → -euse', 'heureux, heureuse'], ['-el → -elle', 'intellectuel, intellectuelle'], ['-f → -ve', 'naïf, naïve'],
      ['-er → -ère', 'fier, fière'], ['-on → -onne', 'bon, bonne'], ['-g → -gue', 'long, longue'], ['-s doubles', 'gros, grosse'],
      ['-eau → -elle', 'beau, belle · nouveau, nouvelle'], ['-en → -enne', 'italien, italienne · coréen, coréenne'], ['-al → -aux', 'amical, amicaux (fem. amicales)'], ['others', 'vieux, vieille · roux, rousse'],
    ].map(([p, e]) => h('tr', null, h('td', null, p), h('td.fr', { lang: 'fr' }, e)))))),
    h('p.note', null, 'Many English adjectives in -ous are -eux in French: curious → curieux, nervous → nerveux. -x words don’t add -s in the plural: heureux, gros, vieux.')),
  bel: () => card('bel, nouvel, vieil',
    h('p', null, 'Three adjectives have a second masculine singular form, used before a vowel or silent h.'),
    ex([['a new book', 'un nouveau livre'], ['a new friend', 'un nouvel ami'], ['a beautiful high school', 'un beau lycée'], ['a handsome man', 'un bel homme (h muet)'], ['an old backpack', 'un vieux sac à dos'], ['an old bird', 'un vieil oiseau']]),
    h('p.note', null, 'Only masculine singular. In the plural it’s back to nouveaux, beaux, vieux.')),
  de: () => card('de, not des',
    h('p', null, 'When a plural adjective comes before the noun, use ', h('b', null, 'de'), ' instead of ', h('b', null, 'des'), '.'),
    ex([['new friends', 'de nouveaux amis'], ['nice friends', 'des amis sympathiques'], ['beautiful high schools', 'de beaux lycées']])),
  gender: () => card('l’ hides the gender',
    h('p', null, 'With “the”, a noun starting with a vowel or silent h is just l’: l’école, l’ordinateur. Learn each one with ', h('b', null, 'un / une'), ' instead.'),
    h('div.scroll', null, h('table', null, h('tbody', null, [
      ['Feminine', '-tion, -sion, -té, -ée, -ie, -ure', 'une invitation, une université, une idée'],
      ['Masculine', '-age, -ment, -eau, -eur, the seasons', 'un étage, un appartement, un oiseau, un été'],
      ['Exceptions', '', 'une image, une erreur, un musée, un lycée'],
    ].map(([g, e, x]) => h('tr', null, h('td', null, h('b', null, g)), h('td', null, e), h('td.fr', { lang: 'fr' }, x)))))),
    ['m', 'f'].map((g) => h('p', null, h('b', null, g === 'm' ? 'un ' : 'une '), h('span.fr', { lang: 'fr' }, LNOUNS.filter((n) => n.g === g).map((n) => n.w).join(', '))))),
  hair: () => card('Hair',
    h('p', null, 'Four special adjectives describe hair: ', h('span.fr', { lang: 'fr' }, 'brun, châtain, blond, roux'), '. Used for the person, they agree with the person:'),
    ex([['He is black-haired.', 'Il est brun.'], ['She is brown-haired.', 'Elle est châtain.'], ['They are blond.', 'Ils sont blonds.'], ['They (f.) are red-haired.', 'Elles sont rousses.']]),
    h('p', null, h('span.fr', { lang: 'fr' }, 'Les cheveux'), ' is always masculine plural, even for a girl:'),
    ex([['He has black hair.', 'Il a les cheveux bruns.'], ['She has brown hair.', 'Elle a les cheveux châtains.'], ['She has red hair.', 'Elle a les cheveux roux.']])),
};
// One-line reminders of the rules that trip people up, shown on the dashboard and on the cards they apply to.
const REMIND = {
  before: ['Before the noun', 'BAGS (beauty, age, goodness, size) go before the noun: ' + BEFORE.join(', ') + '. Everything else goes after.'],
  de: ['de, not des', 'A plural adjective before the noun takes de: de nouveaux amis, but des amis sympathiques.'],
  bel: ['bel, nouvel, vieil', 'Masculine singular before a vowel or silent h: un bel homme, un nouvel ami, un vieil oiseau.'],
  agree: ['Agreement', '+e for feminine, +s for plural. Already ends in -e: no extra -e. -s / -x words add no -s. -ien → -ienne. Marron never changes.'],
  hair: ['Hair', 'Les cheveux is masculine plural, even for a girl: elle a les cheveux bruns.'],
  gender: ['l’ hides the gender', 'Learn l’ nouns with un / une: un ordinateur, une école. -tion, -té, -ie, -ure lean feminine; -age, -ment, -eau lean masculine.'],
};
const REMIND_OF = { sent: ['agree', 'before'], phrase: ['before', 'de', 'bel'], place: ['before'], bel: ['bel'], de: ['de'], hair: ['hair'], gender: ['gender'] };
function remindFor(q) {
  const a = byId[q.word];
  const keys = REMIND_OF[q.topic] || (a && a.before ? (a.alt && q.topic === 'all' ? ['bel'] : ['before']) : []);
  if (!keys.length) return null;
  const [title, text] = REMIND[pick(keys)];
  return h('p.remind', null, h('b', null, title + ': '), text);
}
function Rules() {
  const el = h('div.rules', null, Object.values(RULES).map((r) => r()));
  [...el.children].forEach((c, i) => fadeUp(c, 50 * i));
  return h('div', null, h('h1', null, 'Rules'), h('p.lede', null, 'Grammar from the Leçon 3A1 notes.'), el);
}

/* ---------- dashboard ---------- */
function Home() {
  const l = ADJ.filter((a) => learned(a.id)).length, due = dueWords(), fresh = newWords(), tr = trouble();
  const today = P.days[dayKey()] || 0, streak = dayStreak(), gacc = grammarAcc();
  const tried = GRAMMAR.filter(([t]) => (P.topics[t] || {}).n);
  const acc = (t) => pct(P.topics[t].r, P.topics[t].n);
  const untried = GRAMMAR.find(([t]) => !(P.topics[t] || {}).n);
  const nextG = untried || (tried.length ? tried.reduce((a, b) => (acc(a[0]) <= acc(b[0]) ? a : b)) : null);
  const tile = (label, v, suf, small, sub) => { const n = h('span'); if (v == null) n.textContent = '–'; else countUp(n, v, suf); return h('div.panel.tile', null, h('div.ask', null, label), h('div.num', null, n, small ? h('small', null, small) : null), h('div.note', null, sub)); };
  const act = (label, fn, primary) => h('button.btn' + (primary ? '.primary' : ''), { type: 'button', onclick: fn }, label, h('span', { 'aria-hidden': 'true' }, '→'));
  const tiles = h('div.tiles', null,
    tile('Words learned', l, '', ' / ' + ADJ.length, fresh.length ? fresh.length + ' still new' : 'all learned'),
    tile('Due now', due.length, '', null, due.length ? 'words to review' : l ? 'next ' + when(nextDue()) : 'nothing learned yet'),
    tile('Streak', streak, '', null, (streak === 1 ? 'day' : 'days in a row') + ' · ' + today + ' answers today'),
    tile('Grammar', gacc, '%', null, gacc == null ? 'not started' : 'accuracy'));
  [...tiles.children].forEach((c, i) => fadeUp(c, 60 * i));
  return h('div', null,
    h('h1', null, new Date().getHours() < 18 ? 'Bonjour !' : 'Bonsoir !'),
    h('p.lede', null, due.length ? 'You have ' + due.length + ' word' + (due.length === 1 ? '' : 's') + ' to review. Do those first, they’re about to slip.' : l ? 'No reviews due. Learn some new words or drill the grammar.' : 'Start by learning your first 5 words.'),
    tiles,
    h('div.dash', null,
      h('div.stack', null,
        h('section.panel', null, h('h2', null, 'Next up'),
          h('div.actions', null,
            due.length ? act('Review ' + Math.min(20, due.length) + ' due words', () => go('vocab', Review(due.slice(0, 20).map((a) => a.id), true)), true) : null,
            fresh.length ? act('Learn the next ' + Math.min(5, fresh.length) + ' words', () => go('vocab', Learn(fresh.slice(0, 5).map((a) => a.id))), !due.length) : null,
            act('Take a quiz (like the class handouts)', () => go('sheet'), !due.length && !fresh.length),
            nextG ? act((untried ? 'Grammar, try: ' : 'Grammar, weakest: ') + nextG[1], () => startGrammar([nextG[0]], 10)) : null,
            tr.length ? act('Practise trouble words (' + tr.length + ')', () => go('vocab', Review(tr.map((a) => a.id), false))) : null),
          tr.length ? h('div.words', { lang: 'fr' }, tr.map((a) => h('span', null, a.id))) : null),
        h('section.panel', null, h('h2', null, 'Lessons'),
          LESSONS.map((le) => {
            const ws = ADJ.filter((a) => a.lesson === le.id), lm = ws.filter((a) => learned(a.id)).length;
            return h('div.lesson', null, h('div.code', null, le.id),
              h('div.lesson-body', null, h('b', null, le.title + ' · ' + le.sub), h('div.note', null, lm + ' of ' + ws.length + ' words learned'), h('div', { style: 'margin-top:0.4rem' }, meter((lm / ws.length) * 100, 'good'))),
              h('button.btn', { type: 'button', onclick: () => go('vocab') }, 'Vocab'));
          }))),
      h('section.panel', null, h('h2', null, 'Grammar drills'),
        h('p.note', { style: 'margin:0 0 0.4rem' }, 'Your accuracy in each. Tap one to practise it with its rule beside you.'),
        GRAMMAR.map(([t, label]) => {
          const x = P.topics[t], v = x ? pct(x.r, x.n) : null;
          return h('div.drow', null,
            h('button', { type: 'button', onclick: () => startGrammar([t], 10) }, label),
            meter(v, v == null ? null : v >= 80 ? 'good' : v < 60 ? 'low' : null),
            h('span.pct', null, v == null ? 'new' : v + '%'));
        }),
        h('h2', { style: 'margin-top:1.6rem' }, 'Remember'),
        Object.values(REMIND).map(([title, text]) => h('p.remind', null, h('b', null, title + ': '), text)),
        h('button.btn.ghost.sm', { type: 'button', onclick: () => go('rules') }, 'All the rules →'))));
}

go(location.hash.slice(1));
connect();
</script>
</body>
