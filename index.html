<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Paper and ink, with a tricolore accent: rouge for actions, bleu for masculine, framboise for feminine. */
:root {
  --bg: 250 246 239; --surface: 255 253 249; --sunken: 243 237 227; --ink: 28 33 58; --muted: 100 100 116; --line: 229 220 205;
  --accent: 186 40 56; --accent-soft: 250 229 229; --accent-ink: 255 255 255; --navy: 28 45 102; --side: 24 34 78; --side-ink: 240 236 226;
  --good: 34 118 80; --good-soft: 226 241 232; --bad: 186 40 56; --bad-soft: 250 229 229;
  --warm: 158 112 30; --warm-soft: 247 237 214; --gf: 178 56 118; --gm: 36 76 156;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 20 22 34; --surface: 29 31 46; --sunken: 38 40 58; --ink: 241 235 222; --muted: 168 164 160; --line: 56 56 74;
    --accent: 242 118 126; --accent-soft: 70 36 46; --accent-ink: 20 22 34; --navy: 150 176 240; --side: 13 15 26; --side-ink: 236 232 222;
    --good: 108 200 150; --good-soft: 30 52 42; --bad: 242 118 126; --bad-soft: 70 36 46;
    --warm: 226 182 100; --warm-soft: 60 48 26; --gf: 236 132 186; --gm: 132 168 240;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: 20 22 34; --surface: 29 31 46; --sunken: 38 40 58; --ink: 241 235 222; --muted: 168 164 160; --line: 56 56 74;
  --accent: 242 118 126; --accent-soft: 70 36 46; --accent-ink: 20 22 34; --navy: 150 176 240; --side: 13 15 26; --side-ink: 236 232 222;
  --good: 108 200 150; --good-soft: 30 52 42; --bad: 242 118 126; --bad-soft: 70 36 46;
  --warm: 226 182 100; --warm-soft: 60 48 26; --gf: 236 132 186; --gm: 132 168 240;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font: 15px/1.55 Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
input, button { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 6px; }
.fr { font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-weight: 600; }
.muted { color: rgb(var(--muted)); }
.f { color: rgb(var(--gf)); } .m { color: rgb(var(--gm)); }

/* Dashboard shell: a navy sidebar beside the work area. */
.shell { width: 100%; display: flex; min-height: 100vh; }
aside { width: 248px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; padding: 28px 16px; display: flex; flex-direction: column; gap: 24px; background: rgb(var(--side)); color: rgb(var(--side-ink)); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; font: 700 26px/1 'Cormorant Garamond', Georgia, serif; white-space: nowrap; }
.flag { display: flex; width: 26px; height: 18px; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.flag i { flex: 1; } .flag i:nth-child(1) { background: #2b52c4; } .flag i:nth-child(2) { background: #fff; } .flag i:nth-child(3) { background: #e03a4a; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-weight: 600; color: rgb(var(--side-ink) / 0.72); position: relative; }
nav button:hover { color: rgb(var(--side-ink)); background: rgb(255 255 255 / 0.05); }
nav button[aria-current] { color: rgb(var(--side-ink)); background: rgb(255 255 255 / 0.1); }
nav button[aria-current]::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: #e03a4a; }
nav .meta { margin-left: auto; font-size: 12px; opacity: 0.75; font-variant-numeric: tabular-nums; }
nav .badge { margin-left: auto; background: #e03a4a; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
.side-foot { margin-top: auto; padding: 14px 12px; border-radius: 8px; background: rgb(255 255 255 / 0.06); font-size: 13px; }
.side-foot .meter { background: rgb(255 255 255 / 0.15); margin-top: 8px; }
.side-foot .meter i { background: #fff; }
main { flex: 1; min-width: 0; padding: 36px 44px 72px; }

/* dashboard */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile .num { font: 700 42px/1 'Cormorant Garamond', Georgia, serif; color: rgb(var(--navy)); margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.tile .num small { font-size: 22px; color: rgb(var(--muted)); }
.dash { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.meter { height: 7px; border-radius: 4px; background: rgb(var(--sunken)); overflow: hidden; }
.meter i { display: block; height: 100%; background: rgb(var(--navy)); border-radius: 4px; }
.meter.good i { background: rgb(var(--good)); } .meter.low i { background: rgb(var(--accent)); }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 44px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgb(var(--line)); }
.drow:last-child { border-bottom: 0; }
.drow button { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; color: rgb(var(--ink)); }
.drow button:hover { color: rgb(var(--accent)); }
.drow .pct { text-align: right; font-size: 13px; color: rgb(var(--muted)); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.actions .btn { justify-content: space-between; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips span { border: 1px solid rgb(var(--accent) / 0.35); color: rgb(var(--accent)); border-radius: 999px; padding: 2px 10px; font: 600 17px 'Cormorant Garamond', Georgia, serif; }
.lesson { display: flex; align-items: center; gap: 14px; }
.lesson .code { width: 52px; height: 52px; border-radius: 8px; background: rgb(var(--accent-soft)); color: rgb(var(--accent)); display: grid; place-items: center; font: 700 18px 'Cormorant Garamond', Georgia, serif; flex-shrink: 0; }
.lesson-body { flex: 1; min-width: 0; }
h1 { font: 700 44px/1.05 'Cormorant Garamond', Georgia, serif; margin: 0 0 8px; color: rgb(var(--navy)); }
h2 { font: 700 23px/1.2 'Cormorant Garamond', Georgia, serif; margin: 0 0 10px; color: rgb(var(--navy)); }
.lede { margin: 0 0 24px; color: rgb(var(--muted)); max-width: 62ch; }
.panel { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); border-radius: 6px; padding: 24px; box-shadow: 0 1px 0 rgb(var(--line)); }
.stack > * + * { margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font-weight: 700; padding: 10px 20px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); }
.btn:hover { border-color: rgb(var(--accent) / 0.5); }
.btn.primary { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: rgb(var(--accent-ink)); }
.btn.primary:hover { background: rgb(var(--accent) / 0.9); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* topic picker */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.topics label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid rgb(var(--line)); border-radius: 6px; background: rgb(var(--surface)); cursor: pointer; font-weight: 600; }
.topics label:has(input:checked) { border-color: rgb(var(--navy) / 0.55); }
.topics input { accent-color: rgb(var(--accent)); width: 17px; height: 17px; }
.seg { display: inline-flex; border: 1px solid rgb(var(--line)); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: rgb(var(--surface)); padding: 8px 14px; font-weight: 600; color: rgb(var(--muted)); }
.seg button[aria-pressed="true"] { background: rgb(var(--accent-soft)); color: rgb(var(--accent)); }

/* question card */
.drill { width: 100%; }
.bar { height: 6px; border-radius: 3px; background: rgb(var(--sunken)); overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: rgb(var(--accent)); transition: width .3s; }
.ask { text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; font-weight: 700; color: rgb(var(--muted)); }
.show { font-size: 42px; line-height: 1.2; margin: 8px 0 4px; overflow-wrap: anywhere; }
.show.en { font: 700 24px/1.3 Manrope, system-ui, sans-serif; }
.sub { color: rgb(var(--muted)); margin: 0 0 18px; }
.answer { width: 100%; padding: 12px 14px; border: 1.5px solid rgb(var(--line)); border-radius: 12px; background: rgb(var(--bg)); font-size: 20px; }
.answer.fr { font-size: 24px; }
.answer:focus { outline: none; border-color: rgb(var(--navy)); }
.answer.ok { border-color: rgb(var(--good)); } .answer.no { border-color: rgb(var(--bad)); }
.keys { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.keys button { min-width: 38px; padding: 6px 8px; border-radius: 9px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); font: 600 19px 'Cormorant Garamond', Georgia, serif; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices button { padding: 14px; border-radius: 12px; border: 1.5px solid rgb(var(--line)); background: rgb(var(--surface)); font-weight: 600; font-size: 16px; }
.choices button:hover:not(:disabled) { border-color: rgb(var(--accent)); }
.choices button.ok { border-color: rgb(var(--good)); background: rgb(var(--good-soft)); }
.choices button.no { border-color: rgb(var(--bad)); background: rgb(var(--bad-soft)); }
.fb { border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
.fb.ok { background: rgb(var(--good-soft)); } .fb.no { background: rgb(var(--bad-soft)); }
.fb b { display: block; margin-bottom: 2px; }
.fb .want { font-size: 20px; }
.score { font-size: 44px; font-weight: 700; }
.missed li { margin: 8px 0; }

/* words + rules */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid rgb(var(--line)); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: rgb(var(--muted)); font-weight: 700; }
td.fr { font-size: 18px; }
.scroll { overflow-x: auto; }
.tag { display: inline-block; border: 1px solid rgb(var(--accent) / 0.4); color: rgb(var(--accent)); border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-left: 6px; vertical-align: 2px; }
.tag.good { border-color: rgb(var(--good) / 0.5); color: rgb(var(--good)); }
.tag.warm { border-color: rgb(var(--warm) / 0.5); color: rgb(var(--warm)); }
.note { color: rgb(var(--muted)); font-size: 14px; }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 20px; margin-top: 10px; }
.ex .fr { font-size: 19px; }
.big { font: 600 26px/1.4 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.02em; }
.big b { color: rgb(var(--accent)); }
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

/* vocab */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid rgb(var(--line)); margin-bottom: 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: rgb(var(--muted)); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: rgb(var(--accent)); border-bottom-color: rgb(var(--accent)); }
.study .show { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
.meaning { font-size: 20px; font-weight: 700; margin: 4px 0 16px; }
.forms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.forms span { background: rgb(var(--sunken)); border-radius: 6px; padding: 8px 10px; font-size: 21px; }
.forms small { display: block; font: 700 11px Manrope, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: rgb(var(--muted)); }

/* grammar: the drill with its rule beside it */
.with-help { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 0.8fr); gap: 24px; align-items: start; }
.help { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
.help .panel { background: rgb(var(--sunken) / 0.6); }
.topics .meta { margin-left: auto; font-size: 13px; color: rgb(var(--muted)); }

@media (max-width: 1180px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash { grid-template-columns: 1fr; }
  .with-help { grid-template-columns: 1fr; }
  .help { position: static; max-height: none; }
}
@media (max-width: 760px) {
  .shell { flex-direction: column; }
  aside { position: static; height: auto; width: auto; padding: 12px 16px; flex-direction: row; align-items: center; gap: 12px; }
  .brand { font-size: 21px; padding: 0; }
  .brand b { display: none; }
  nav { flex-direction: row; overflow-x: auto; }
  nav button { white-space: nowrap; padding: 8px 10px; }
  nav .meta, nav .badge, .side-foot { display: none; }
  nav button[aria-current]::before { left: 10px; right: 10px; top: auto; bottom: 2px; width: auto; height: 2px; }
  main { padding: 24px 16px 48px; }
  h1 { font-size: 36px; }
  .show { font-size: 34px; }
  .rules { grid-template-columns: 1fr; }
  .ex { grid-template-columns: 1fr; }
  .ex .en-ex { margin-top: 6px; }
  .drow { grid-template-columns: minmax(0, 1fr) 70px 40px; }
  .forms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><span class="flag" aria-hidden="true"><i></i><i></i><i></i></span><b>French Hub</b></div>
    <nav aria-label="Sections" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main"></main>
</div>
<script src="french.js"></script>
<script>
const { ADJ, LESSONS, GROUPS, BEFORE, VOCAB, GRAMMAR, RULE_OF, question, check, review, DAY, MIN } = window.FR;
const $main = document.getElementById('main');

// h('div.class', {attrs}, ...children): a tiny DOM builder. Strings become text nodes, so nothing is parsed as HTML.
function h(tag, attrs, ...kids) {
  const [name, ...cls] = tag.split('.');
  const el = document.createElement(name);
  if (cls.length) el.className = cls.join(' ');
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k);
  return el;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('frhub:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('frhub:' + k, JSON.stringify(v)); } catch (e) { /* private mode: fine */ } },
};
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const byId = window.FR.byId;

/* ---------- progress ---------- */
// cards: word id → FSRS card (a word has one once it's learned). words: id → { n seen, r right, s right-in-a-row }.
// topics: drill id → { n, r }. days: 'YYYY-MM-DD' → answers that day.
const P = Object.assign({ words: {}, topics: {}, days: {}, cards: {} }, store.get('progress', {}));
P.cards ||= {};
const save = () => store.set('progress', P);
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function record(q, ok) {
  const w = P.words[q.word] ||= { n: 0, r: 0, s: 0 };
  w.n++; if (ok) { w.r++; w.s++; } else w.s = 0;
  const t = P.topics[q.topic] ||= { n: 0, r: 0 };
  t.n++; if (ok) t.r++;
  P.days[dayKey()] = (P.days[dayKey()] || 0) + 1;
  save();
}
const learned = (id) => !!P.cards[id];
const dueWords = (now = Date.now()) => ADJ.filter((a) => P.cards[a.id] && P.cards[a.id].due <= now).sort((a, b) => P.cards[a.id].due - P.cards[b.id].due);
const newWords = () => ADJ.filter((a) => !learned(a.id));
const nextDue = () => Math.min(...ADJ.map((a) => (P.cards[a.id] ? P.cards[a.id].due : Infinity)));
const trouble = () => ADJ.filter((a) => { const w = P.words[a.id]; return w && w.n && (w.s === 0 || (w.n >= 3 && w.r / w.n < 0.6)); });
function dayStreak() {
  const d = new Date(); let n = 0;
  if (!P.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (P.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const pct = (r, n) => (n ? Math.round((r / n) * 100) : null);
const meter = (v, cls) => h('div.meter' + (cls ? '.' + cls : ''), null, h('i', { style: 'width:' + (v || 0) + '%' }));
function when(t) {
  const d = t - Date.now();
  if (!isFinite(t)) return '–';
  if (d <= 0) return 'now';
  if (d < 3600000) return 'in ' + Math.max(1, Math.round(d / MIN)) + ' min';
  if (d < DAY) return 'in ' + Math.round(d / 3600000) + ' h';
  const days = Math.round(d / DAY);
  return days === 1 ? 'tomorrow' : 'in ' + days + ' days';
}
function grammarAcc() {
  const t = GRAMMAR.reduce((a, [id]) => { const x = P.topics[id] || { n: 0, r: 0 }; return { n: a.n + x.n, r: a.r + x.r }; }, { n: 0, r: 0 });
  return pct(t.r, t.n);
}

/* ---------- navigation ---------- */
const PAGES = { home: Home, vocab: Vocab, grammar: Grammar, rules: Rules };
const OLD = { practice: 'grammar', words: 'vocab' };
const NAV = [['home', 'Dashboard'], ['vocab', 'Vocab'], ['grammar', 'Grammar'], ['rules', 'Rules']];
let current = 'home';
function renderNav() {
  const due = dueWords().length, g = grammarAcc(), l = ADJ.filter((a) => learned(a.id)).length;
  document.getElementById('nav').replaceChildren(...NAV.map(([id, label]) => h('button', { type: 'button', 'aria-current': id === current ? 'page' : null, onclick: () => go(id) }, label,
    id === 'vocab' && due ? h('span.badge', { title: due + ' words due for review' }, String(due)) : null,
    id === 'grammar' && g != null ? h('span.meta', null, g + '%') : null)));
  document.getElementById('side-foot').replaceChildren(h('div', null, l + ' / ' + ADJ.length + ' words learned'), meter((l / ADJ.length) * 100));
}
function go(page, view) {
  page = OLD[page] || page;
  if (!PAGES[page]) page = 'home';
  current = page;
  if (location.hash.slice(1) !== page) history.replaceState(null, '', '#' + page);
  renderNav();
  $main.replaceChildren(view || PAGES[page]());
  window.scrollTo(0, 0);
}
const show = (page, view) => go(page, view); // open a page with a specific view (a session) in it
window.addEventListener('hashchange', () => go(location.hash.slice(1)));

/* ---------- one question ---------- */
// Renders a question; calls onGraded(result) once and onNext() when the learner moves on.
function QCard(q, { onGraded, onNext, nextLabel = 'Next' }) {
  let done = false;
  const fb = h('div', { 'aria-live': 'polite' });
  const nextBtn = h('button.btn.primary', { type: 'button', hidden: true, onclick: () => onNext() }, nextLabel);
  function grade(given) {
    if (done) return;
    if (!q.choices && !given.trim()) return;
    const r = q.choices ? { ok: given === q.answers[0], accent: false } : check(q, given);
    done = true;
    record(q, r.ok);
    onGraded && onGraded(r);
    fb.replaceChildren(h('div.fb.' + (r.ok ? 'ok' : 'no'), null,
      h('b', null, r.ok ? (r.accent ? 'Right, but watch the accent' : 'Right') : 'Not quite'),
      !r.ok || r.accent ? h('div.want' + (q.lang === 'en' ? '' : '.fr'), null, q.answers[0]) : null,
      h('div', null, q.why)));
    nextBtn.hidden = false;
    nextBtn.focus();
    return r;
  }
  let body;
  if (q.choices) {
    body = h('div.choices', null, q.choices.map((c) => h('button', { type: 'button', onclick: (e) => {
      if (done) return;
      grade(c);
      body.querySelectorAll('button').forEach((b) => { b.disabled = true; if (b.textContent === q.answers[0]) b.classList.add('ok'); else if (b === e.currentTarget) b.classList.add('no'); });
    } }, c)));
  } else {
    const input = h('input.answer' + (q.lang === 'fr' ? '.fr' : ''), { type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', lang: q.lang, 'aria-label': q.ask });
    const checkBtn = h('button.btn.primary', { type: 'button', onclick: () => submit() }, 'Check');
    const submit = () => { const r = grade(input.value); if (r) { input.classList.add(r.ok ? 'ok' : 'no'); input.readOnly = true; checkBtn.hidden = true; } };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done ? onNext() : submit(); } });
    const keys = q.lang === 'fr' ? h('div.keys', { 'aria-label': 'Accented letters' }, ['é', 'è', 'ê', 'à', 'â', 'ç', 'ï', 'î', 'ô', 'û'].map((c) => h('button', { type: 'button', tabindex: '-1', onclick: () => {
      if (done) return;
      const s = input.selectionStart ?? input.value.length, e2 = input.selectionEnd ?? s;
      input.value = input.value.slice(0, s) + c + input.value.slice(e2); input.focus(); input.setSelectionRange(s + 1, s + 1);
    } }, c))) : null;
    body = h('div', null, input, keys, h('div.row', { style: 'margin-top:14px' }, checkBtn));
    setTimeout(() => input.focus(), 0);
  }
  return h('div.panel', null,
    h('div.ask', null, q.ask),
    h('div.show' + (q.showLang === 'fr' ? '.fr' : '.en'), { lang: q.showLang }, q.show),
    q.sub ? h('p.sub', null, q.sub) : h('div', { style: 'height:14px' }),
    body, fb,
    h('div.row', { style: 'margin-top:14px' }, nextBtn));
}

// A run of questions. next() returns the next question or null when finished. Shows a summary at the end.
function Run({ total, next, onAnswer, summary, title, aside }) {
  let n = 0, right = 0;
  const missed = [];
  const wrap = h('div.drill');
  const head = h('div.run-head');
  function step() {
    const q = next(n);
    if (!q) return finish();
    const bar = total ? h('div.bar', null, h('i', { style: 'width:' + Math.min(100, (n / total) * 100) + '%' })) : null;
    head.replaceChildren(h('div.row', { style: 'justify-content:space-between;margin-bottom:10px' },
      h('span.muted', null, title + (total ? ' · ' + (n + 1) + ' / ' + total : n ? ' · ' + right + ' / ' + n + ' right' : '')),
      h('button.btn', { type: 'button', onclick: finish }, 'Finish')), bar);
    aside && aside(q);
    wrap.replaceChildren(head, QCard(q, {
      onGraded: (r) => { if (r.ok) right++; else missed.push(q); onAnswer && onAnswer(q, r); },
      onNext: () => { n++; step(); },
    }));
  }
  function finish() {
    const done = right + missed.length;
    renderNav();
    wrap.replaceChildren(h('div.panel.stack', null,
      h('div.ask', null, title + ': done'),
      h('div', null, h('span.score', null, right + ' / ' + done), h('span.muted', null, ' right')),
      summary ? summary() : null,
      missed.length ? h('div', null, h('h2', null, 'To look at again'), h('ul.missed', null, missed.map((q) => h('li', null,
        h('span' + (q.showLang === 'fr' ? '.fr' : ''), null, q.show), ' → ', h('b' + (q.lang === 'en' ? '' : '.fr'), null, q.answers[0]))))) : null,
      h('div.row', null, h('button.btn.primary', { type: 'button', onclick: () => go(current) }, 'Back to ' + Object.fromEntries(NAV)[current]), h('button.btn', { type: 'button', onclick: () => go('home') }, 'Dashboard'))));
  }
  step();
  return wrap;
}

/* ---------- vocab ---------- */
const formsRow = (a) => h('div.forms', { lang: 'fr' }, a.f.map((f, i) => h('span.fr.' + (i % 2 ? 'f' : 'm'), null, h('small', null, ['m.', 'f.', 'm. pl.', 'f. pl.'][i]), f)));
function Vocab() {
  let tab = store.get('vtab', 'learn');
  const due = dueWords(), fresh = newWords(), l = ADJ.length - fresh.length;
  const body = h('div');
  const tabs = h('div.tabs', { role: 'tablist' });
  function setTab(t) {
    tab = t; store.set('vtab', t);
    tabs.replaceChildren(...[['learn', 'Learn' + (fresh.length ? ' (' + fresh.length + ' new)' : '')], ['review', 'Review' + (due.length ? ' (' + due.length + ' due)' : '')], ['all', 'All words']].map(([id, label]) =>
      h('button', { type: 'button', role: 'tab', 'aria-selected': String(id === tab), onclick: () => setTab(id) }, label)));
    body.replaceChildren({ learn: LearnTab, review: ReviewTab, all: AllWords }[tab]());
  }
  setTab(tab);
  return h('div', null,
    h('h1', null, 'Vocab'),
    h('p.lede', null, l + ' of ' + ADJ.length + ' words learned · ' + due.length + ' due now' + (due.length ? '' : ' · next review ' + when(nextDue())) + '. Learn new words in groups of 5, then review them when they’re due: the gaps grow as you remember them.'),
    tabs, body);
}
function LearnTab() {
  const fresh = newWords(), group = fresh.slice(0, 5);
  if (!group.length) return h('section.panel', null, h('h2', null, 'Every word is learned'), h('p', null, 'Keep them fresh with reviews. They come back just before you’d forget them.'), h('button.btn.primary', { type: 'button', onclick: () => { store.set('vtab', 'review'); go('vocab'); } }, 'Go to review'));
  return h('section.panel.stack', null,
    h('h2', null, 'Next 5 words'),
    h('div.chips', { lang: 'fr' }, group.map((a) => h('span', null, a.f[0]))),
    h('p.note', null, 'You’ll see each word with its four forms, then type its meaning both ways. Words you miss come back until you get them.'),
    h('button.btn.primary', { type: 'button', onclick: () => show('vocab', Learn(group.map((a) => a.id))) }, 'Start learning'));
}
function Learn(ids) {
  const words = ids.map((id) => byId[id]);
  const wrap = h('div.drill');
  let i = 0;
  function study() {
    const a = words[i];
    wrap.replaceChildren(
      h('div.row', { style: 'justify-content:space-between;margin-bottom:10px' }, h('span.muted', null, 'Learn · word ' + (i + 1) + ' of ' + words.length), h('button.btn', { type: 'button', onclick: () => go('vocab') }, 'Stop')),
      h('div.bar', null, h('i', { style: 'width:' + (i / words.length) * 50 + '%' })),
      h('div.panel.study', null,
        h('div.ask', null, GROUPS[a.group]),
        h('div.show.fr', { lang: 'fr' }, a.f[0], a.alt ? h('span.tag.warm', null, a.alt) : null, a.before ? h('span.tag', null, 'before') : null),
        h('p.meaning', null, a.en.join(', ')),
        formsRow(a),
        a.note ? h('p.note', null, a.note) : null,
        a.alt ? h('p.note', null, a.alt + ' is used before a masculine noun starting with a vowel or silent h: un ' + a.alt + ' ami.') : null,
        h('div.row', { style: 'margin-top:18px' },
          i ? h('button.btn', { type: 'button', onclick: () => { i--; study(); } }, 'Back') : null,
          h('button.btn.primary', { type: 'button', onclick: () => { i++; i < words.length ? study() : quiz(); } }, i + 1 < words.length ? 'Next word' : 'Quiz me'))));
  }
  function quiz() {
    // Each word, both directions; a miss puts that question back at the end.
    const queue = shuffle(words.flatMap((a) => [['fr-en', a.id], ['en-fr', a.id]]));
    const missedWord = {}, answered = {};
    const total = queue.length;
    wrap.replaceChildren(Run({
      title: 'Learn', total,
      next: () => { const x = queue.shift(); return x ? question([x[0]], [x[1]]) : null; },
      onAnswer: (q, r) => { answered[q.word] = true; if (!r.ok) { missedWord[q.word] = true; queue.push([q.topic, q.word]); } },
      summary: () => {
        const now = Date.now();
        const got = words.filter((a) => answered[a.id]); // stopping early only counts the words you were quizzed on
        got.forEach((a) => { if (!P.cards[a.id]) P.cards[a.id] = review(null, missedWord[a.id] ? 1 : 3, now); });
        save(); renderNav();
        return got.length ? h('p', null, got.length + (got.length === 1 ? ' word' : ' words') + ' learned. First review ' + when(Math.min(...got.map((a) => P.cards[a.id].due))) + '.') : null;
      },
    }));
  }

}
function ReviewTab() {
  const due = dueWords(), learnedN = ADJ.filter((a) => learned(a.id)).length;
  if (!learnedN) return h('section.panel', null, h('h2', null, 'Nothing to review yet'), h('p', null, 'Learn your first 5 words; they’ll show up here when they’re due.'));
  const extra = h('button.btn', { type: 'button', onclick: () => show('vocab', Review(shuffle(ADJ.filter((a) => learned(a.id))).slice(0, 15).map((a) => a.id), false)) }, 'Extra practice (doesn’t change the schedule)');
  if (!due.length) return h('section.panel.stack', null, h('h2', null, 'All caught up'), h('p', null, 'Next review ' + when(nextDue()) + '.'), extra);
  return h('section.panel.stack', null,
    h('h2', null, due.length + (due.length === 1 ? ' word is' : ' words are') + ' due'),
    h('div.chips', { lang: 'fr' }, due.slice(0, 30).map((a) => h('span', null, a.f[0]))),
    h('div.row', null, h('button.btn.primary', { type: 'button', onclick: () => show('vocab', Review(due.slice(0, 20).map((a) => a.id), true)) }, 'Start review' + (due.length > 20 ? ' (20)' : '')), extra));
}
// One question per word, a random kind; a miss reschedules the word and asks it again at the end.
function Review(ids, schedule) {
  const queue = ids.slice(), graded = {}, again = {};
  return Run({
    title: schedule ? 'Review' : 'Extra practice', total: ids.length,
    next: () => { const id = queue.shift(); return id ? question([pick(['fr-en', 'en-fr', 'forms'])], [id]) : null; },
    onAnswer: (q, r) => {
      if (schedule && !graded[q.word]) { graded[q.word] = true; P.cards[q.word] = review(P.cards[q.word], r.ok ? (r.accent ? 2 : 3) : 1, Date.now()); save(); }
      if (!r.ok && !again[q.word]) { again[q.word] = true; queue.push(q.word); }
    },
    summary: schedule ? () => h('p', null, 'Next review ' + when(nextDue()) + '.') : null,
  });
}
function AllWords() {
  const status = (a) => {
    const c = P.cards[a.id];
    if (!c) return h('span.muted', null, 'new');
    return c.due <= Date.now() ? h('span.tag', null, 'due') : h('span.muted', null, 'review ' + when(c.due));
  };
  return h('div.stack', null, Object.keys(GROUPS).map((g) => h('section.panel', null, h('h2', null, GROUPS[g]), h('div.scroll', null, h('table', null,
    h('thead', null, h('tr', null, ['Masc. sg.', 'Meaning', 'Fem. sg.', 'Masc. pl.', 'Fem. pl.', 'Status'].map((t) => h('th', null, t)))),
    h('tbody', null, ADJ.filter((a) => a.group === g).map((a) => h('tr', null,
      h('td.fr.m', { lang: 'fr' }, a.f[0], a.alt ? h('span.tag.warm', { title: 'before a vowel or silent h' }, a.alt) : null),
      h('td', null, a.en.join(', '), a.before ? h('span.tag', null, 'before') : null, a.note ? h('div.note', null, a.note) : null),
      h('td.fr.f', { lang: 'fr' }, a.f[1]), h('td.fr.m', { lang: 'fr' }, a.f[2]), h('td.fr.f', { lang: 'fr' }, a.f[3]),
      h('td', null, status(a))))))))));
}

/* ---------- grammar ---------- */
function helpFor(topics) {
  const ids = [...new Set(topics.flatMap((t) => RULE_OF[t] || []))];
  return h('div.stack', null, h('div.ask', null, 'Rule help'), ids.map((id) => RULES[id]()));
}
function Grammar() {
  let picked = store.get('gtopics', GRAMMAR.map(([t]) => t)).filter((t) => RULE_OF[t]);
  let len = store.get('len', 10);
  const help = h('div.help', { role: 'complementary', 'aria-label': 'Rule help' });
  const start = h('button.btn.primary', { type: 'button', onclick: () => startGrammar(picked, len) }, 'Start');
  const sync = () => { start.disabled = !picked.length; store.set('gtopics', picked); help.replaceChildren(helpFor(picked.length ? picked : GRAMMAR.map(([t]) => t))); };
  const lens = [[10, '10'], [20, '20'], [0, 'Endless']];
  const seg = h('div.seg', { role: 'group', 'aria-label': 'How many questions' }, lens.map(([n, l]) =>
    h('button', { type: 'button', 'aria-pressed': String(n === len), onclick: (e) => { len = n; store.set('len', n); seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget))); } }, l)));
  sync();
  return h('div', null,
    h('h1', null, 'Grammar'),
    h('p.lede', null, 'Adjectives in phrases and sentences. The rule for each question stays open beside it; every answer explains itself. Accents are optional but flagged.'),
    h('div.with-help', null,
      h('div.stack', null,
        h('div.topics', null, GRAMMAR.map(([t, label]) => {
          const x = P.topics[t];
          return h('label', null, h('input', { type: 'checkbox', checked: picked.includes(t), onchange: (e) => { picked = e.target.checked ? [...picked, t] : picked.filter((y) => y !== t); sync(); } }),
            h('span', null, label), x ? h('span.meta', null, pct(x.r, x.n) + '%') : null);
        })),
        h('div.row', null, seg, start)),
      help));
}
function startGrammar(topics, len, words) {
  const help = h('div.help', { role: 'complementary', 'aria-label': 'Rule help' });
  const run = Run({ title: 'Grammar', total: len, next: (n) => (len && n >= len ? null : question(topics, words)), aside: (q) => help.replaceChildren(helpFor([q.topic])) });
  show('grammar', h('div.with-help', null, run, help));
}

/* ---------- rules ---------- */
const ex = (pairs) => h('div.ex', null, pairs.flatMap(([en, fr]) => [h('div.en-ex.muted', null, en), h('div.fr', { lang: 'fr' }, fr)]));
const card = (title, ...kids) => h('section.panel', null, h('h2', null, title), ...kids);
const RULES = {
  agree: () => card('Agreement',
    h('p', null, 'Adjectives match the noun: add ', h('b', null, '-e'), ' for feminine, ', h('b', null, '-s'), ' for plural.'),
    ex([['a green bird', 'un oiseau vert'], ['a green house', 'une maison verte'], ['green birds', 'des oiseaux verts'], ['The houses are green.', 'Les maisons sont vertes.']]),
    h('p.note', null, 'Already ends in -e (jeune, raide): no extra -e. Marron never changes. Before a vowel, le / la become l’: l’ami, l’histoire.')),
  before: () => card('11 adjectives go before the noun',
    h('p.big', { lang: 'fr' }, BEFORE.map((w, i) => [i ? ' · ' : '', h('b', null, w[0].toUpperCase()), w.slice(1)])),
    h('p.note', null, 'Everything else goes after the noun.'),
    ex([['a small intellectual man', 'un petit homme intellectuel'], ['a new French story', 'une nouvelle histoire française'], ['a young beautiful dog', 'un jeune et beau chien'], ['an ugly green bird', 'un oiseau laid et vert']])),
  irr: () => card('Irregular patterns',
    h('div.scroll', null, h('table', null, h('tbody', null, [
      ['-eux → -euse', 'heureux, heureuse'], ['-el → -elle', 'intellectuel, intellectuelle'], ['-f → -ve', 'naïf, naïve'],
      ['-er → -ère', 'fier, fière'], ['-on → -onne', 'bon, bonne'], ['-g → -gue', 'long, longue'], ['-s doubles', 'gros, grosse'],
      ['-eau → -elle', 'beau, belle · nouveau, nouvelle'], ['others', 'vieux, vieille · roux, rousse'],
    ].map(([p, e]) => h('tr', null, h('td', null, p), h('td.fr', { lang: 'fr' }, e)))))),
    h('p.note', null, 'Many English adjectives in -ous are -eux in French: curious → curieux, nervous → nerveux. -x words don’t add -s in the plural: heureux, gros, vieux.')),
  bel: () => card('bel, nouvel, vieil',
    h('p', null, 'Three adjectives have a second masculine singular form, used before a vowel or silent h.'),
    ex([['a new book', 'un nouveau livre'], ['a new friend', 'un nouvel ami'], ['a beautiful high school', 'un beau lycée'], ['a handsome man', 'un bel homme (h muet)'], ['an old backpack', 'un vieux sac à dos'], ['an old bird', 'un vieil oiseau']]),
    h('p.note', null, 'Only masculine singular. In the plural it’s back to nouveaux, beaux, vieux.')),
  de: () => card('de, not des',
    h('p', null, 'When a plural adjective comes before the noun, use ', h('b', null, 'de'), ' instead of ', h('b', null, 'des'), '.'),
    ex([['new friends', 'de nouveaux amis'], ['nice friends', 'des amis sympathiques'], ['beautiful high schools', 'de beaux lycées']])),
  hair: () => card('Hair',
    h('p', null, 'Four special adjectives describe hair: ', h('span.fr', { lang: 'fr' }, 'brun, châtain, blond, roux'), '. Used for the person, they agree with the person:'),
    ex([['He is black-haired.', 'Il est brun.'], ['She is brown-haired.', 'Elle est châtain.'], ['They are blond.', 'Ils sont blonds.'], ['They (f.) are red-haired.', 'Elles sont rousses.']]),
    h('p', null, h('span.fr', { lang: 'fr' }, 'Les cheveux'), ' is always masculine plural, even for a girl:'),
    ex([['He has black hair.', 'Il a les cheveux bruns.'], ['She has brown hair.', 'Elle a les cheveux châtains.'], ['She has red hair.', 'Elle a les cheveux roux.']])),
};
function Rules() {
  return h('div', null,
    h('h1', null, 'Rules'),
    h('p.lede', null, 'Grammar from the Leçon 3A1 notes.'),
    h('div.rules', null, Object.values(RULES).map((r) => r())));
}

/* ---------- dashboard ---------- */
function Home() {
  const l = ADJ.filter((a) => learned(a.id)).length, due = dueWords(), fresh = newWords(), tr = trouble();
  const today = P.days[dayKey()] || 0, streak = dayStreak(), gacc = grammarAcc();
  const tried = GRAMMAR.filter(([t]) => (P.topics[t] || {}).n);
  const acc = (t) => pct(P.topics[t].r, P.topics[t].n);
  const untried = GRAMMAR.find(([t]) => !(P.topics[t] || {}).n);
  const nextG = untried || (tried.length ? tried.reduce((a, b) => (acc(a[0]) <= acc(b[0]) ? a : b)) : null);
  const tile = (label, num, sub) => h('div.panel.tile', null, h('div.ask', null, label), h('div.num', null, ...num), h('div.note', null, sub));
  const act = (label, fn, primary) => h('button.btn' + (primary ? '.primary' : ''), { type: 'button', onclick: fn }, label, h('span', { 'aria-hidden': 'true' }, '→'));
  return h('div', null,
    h('h1', null, new Date().getHours() < 18 ? 'Bonjour !' : 'Bonsoir !'),
    h('p.lede', null, due.length ? 'You have ' + due.length + ' word' + (due.length === 1 ? '' : 's') + ' to review. Do those first, they’re about to slip.' : l ? 'No reviews due. Learn some new words or drill the grammar.' : 'Start by learning your first 5 words.'),
    h('div.tiles', null,
      tile('Words learned', [String(l), h('small', null, ' / ' + ADJ.length)], fresh.length ? fresh.length + ' still new' : 'all learned'),
      tile('Due now', [String(due.length)], due.length ? 'words to review' : 'next ' + when(nextDue())),
      tile('Streak', [String(streak)], (streak === 1 ? 'day' : 'days in a row') + ' · ' + today + ' answers today'),
      tile('Grammar', [gacc == null ? '–' : gacc + '%'], gacc == null ? 'not started' : 'accuracy')),
    h('div.dash', null,
      h('div.stack', null,
        h('section.panel', null, h('h2', null, 'Next up'),
          h('div.actions', null,
            due.length ? act('Review ' + Math.min(20, due.length) + ' due words', () => show('vocab', Review(due.slice(0, 20).map((a) => a.id), true)), true) : null,
            fresh.length ? act('Learn the next ' + Math.min(5, fresh.length) + ' words', () => show('vocab', Learn(fresh.slice(0, 5).map((a) => a.id))), !due.length) : null,
            nextG ? act((untried ? 'Grammar, try: ' : 'Grammar, weakest: ') + nextG[1], () => startGrammar([nextG[0]], 10)) : null,
            tr.length ? act('Practise trouble words (' + tr.length + ')', () => show('vocab', Review(tr.map((a) => a.id), false))) : null),
          tr.length ? h('div.chips', { lang: 'fr' }, tr.map((a) => h('span', null, a.id))) : null),
        h('section.panel', null, h('h2', null, 'Lessons'),
          LESSONS.map((le) => {
            const ws = ADJ.filter((a) => a.lesson === le.id), lm = ws.filter((a) => learned(a.id)).length;
            return h('div.lesson', null, h('div.code', null, le.id),
              h('div.lesson-body', null, h('b', null, le.title + ' · ' + le.sub), h('div.note', null, lm + ' of ' + ws.length + ' words learned'), h('div', { style: 'margin-top:6px' }, meter((lm / ws.length) * 100, 'good'))),
              h('button.btn', { type: 'button', onclick: () => go('vocab') }, 'Vocab'));
          }))),
      h('section.panel', null, h('h2', null, 'Grammar drills'),
        h('p.note', { style: 'margin:0 0 6px' }, 'Your accuracy in each. Tap one to practise it with its rule beside you.'),
        GRAMMAR.map(([t, label]) => {
          const x = P.topics[t], v = x ? pct(x.r, x.n) : null;
          return h('div.drow', null,
            h('button', { type: 'button', onclick: () => startGrammar([t], 10) }, label),
            meter(v, v == null ? null : v >= 80 ? 'good' : v < 60 ? 'low' : null),
            h('span.pct', null, v == null ? 'new' : v + '%'));
        }))));
}
